name: 📦 Build & Publish Standalone Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: AntigravityBridge-windows-x64.exe
            output_name: AntigravityBridge.exe
            build_cmd: pyinstaller --noconfirm --onefile --name "AntigravityBridge-windows-x64" --hidden-import "uvicorn" --hidden-import "starlette" --hidden-import "pyngrok" --hidden-import "dotenv" --hidden-import "psutil" --hidden-import "mcp" app_entry.py
          - os: ubuntu-latest
            artifact_name: AntigravityBridge-linux-x64
            output_name: AntigravityBridge-linux-x64
            build_cmd: pyinstaller --noconfirm --onefile --name "AntigravityBridge-linux-x64" --hidden-import "uvicorn" --hidden-import "starlette" --hidden-import "pyngrok" --hidden-import "dotenv" --hidden-import "psutil" --hidden-import "mcp" app_entry.py
          - os: macos-latest
            artifact_name: AntigravityBridge-macos-universal
            output_name: AntigravityBridge-macos-universal
            build_cmd: pyinstaller --noconfirm --onefile --name "AntigravityBridge-macos-universal" --hidden-import "uvicorn" --hidden-import "starlette" --hidden-import "pyngrok" --hidden-import "dotenv" --hidden-import "psutil" --hidden-import "mcp" app_entry.py

    steps:
    - name: 📥 Check out repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 📦 Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller httpx

    - name: ⚙️ Build Standalone Binary with PyInstaller
      run: ${{ matrix.build_cmd }}

    - name: 📤 Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/*
        if-no-files-found: error

  release:
    name: 🚀 Create GitHub Release & Attach Binaries
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Check out repository
      uses: actions/checkout@v4

    - name: 📥 Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        path: release_artifacts

    - name: 📦 Prepare Release Assets
      run: |
        mkdir -p release_dist
        find release_artifacts -type f -exec cp {} release_dist/ \;
        ls -la release_dist

    - name: 🌟 Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version || github.ref_name }}
        name: Release ${{ github.event.inputs.version || github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: release_dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
